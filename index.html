<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFESE App - Control de Stock</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .card, .modal-content, .form-control, .form-select, header { background-color: #1e293b !important; color: #f8fafc !important; border-color: #334155 !important; }
        .form-control::placeholder, .form-select { color: #94a3b8 !important; }
        .form-control:focus, .form-select:focus { background-color: #0f172a !important; color: #fff !important; border-color: #3b82f6 !important; box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25); }
        .product-img { height: 160px; object-fit: cover; background-color: #090d16; }
        #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .cost-section { background-color: #0f172a; border: 1px dashed #475569; }
    </style>
</head>
<body>

    <!-- Pantalla de Autenticación (Login) -->
    <div id="auth-screen" class="container">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-5 col-lg-4">
                <div class="card p-4 shadow-lg border-secondary">
                    <div class="text-center mb-4">
                        <div class="bg-primary p-3 rounded-3 d-inline-block text-white shadow mb-2">
                            <i class="fa-solid fa-boxes-stacked fs-2"></i>
                        </div>
                        <h2 class="fw-bold text-white mb-0">EFESE <span class="text-primary fw-light">App</span></h2>
                        <small class="text-muted">Control de Stock Seguro</small>
                    </div>
                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Correo Electrónico</label>
                            <input type="email" id="login-email" required class="form-control border-secondary" placeholder="tucorreo@gmail.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Contraseña</label>
                            <input type="password" id="login-password" required class="form-control border-secondary" placeholder="••••••••">
                        </div>
                        <div id="login-error" class="text-danger small mb-3 d-none"></div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-medium shadow-sm">Iniciar Sesión</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenido Principal de la App -->
    <div id="app-screen" class="d-none">
        <!-- Header -->
        <header class="border-bottom sticky-top py-3 shadow-sm">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="bg-primary p-2.5 rounded-3 text-white shadow">
                        <i class="fa-solid fa-boxes-stacked fs-4"></i>
                    </div>
                    <div>
                        <h1 class="h4 mb-0 fw-bold text-white">EFESE <span class="text-primary fw-light">App</span></h1>
                        <small class="text-muted" id="user-display">Sincronizado en la nube</small>
                    </div>
                </div>

                <div class="d-flex flex-wrap align-items-center gap-2">
                    <div class="bg-dark border px-3 py-2 rounded-3 d-flex align-items-center gap-2 small">
                        <i class="fa-solid fa-dollar-sign text-success"></i>
                        <span>Dólar Oficial: <strong id="dolar-value" class="text-success">Cargando...</strong></span>
                        <button onclick="fetchDolar()" class="btn btn-sm btn-link text-muted p-0 ms-1" title="Actualizar Dólar">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>

                    <button onclick="toggleGlobalCosts()" id="btn-toggle-costs" class="btn btn-outline-warning btn-sm px-3 py-2 fw-medium d-flex align-items-center gap-2" title="Mostrar u Ocultar Costos y Ganancias">
                        <i class="fa-solid fa-eye-slash"></i> <span id="toggle-text">Ver Costos</span>
                    </button>

                    <button onclick="logout()" class="btn btn-outline-danger btn-sm px-3 py-2 fw-medium d-flex align-items-center gap-2">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Container -->
        <main class="container py-4">
            <!-- Action Bar & Filters -->
            <div class="row g-3 mb-4 align-items-center">
                <div class="col-12 col-md-8 d-flex flex-column flex-sm-row gap-2">
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="search-input" oninput="filterProducts()" placeholder="Buscar artículo..." class="form-control border-secondary">
                    </div>
                    <select id="filter-category" onchange="filterProducts()" class="form-select border-secondary">
                        <option value="">Todas las categorías</option>
                        <option value="Parlantes">Parlantes</option>
                        <option value="Auriculares">Auriculares</option>
                        <option value="Cables USB">Cables USB</option>
                        <option value="Cargadores">Cargadores</option>
                        <option value="Power Bank">Power Bank</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="col-12 col-md-4 text-md-end">
                    <button onclick="openModal()" class="btn btn-primary px-4 fw-medium shadow-sm w-100">
                        <i class="fa-solid fa-plus me-1"></i> Nuevo Artículo
                    </button>
                </div>
            </div>

            <!-- Products Grid -->
            <div id="products-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <!-- Dinámico -->
            </div>

            <div id="empty-state" class="text-center py-5 d-none">
                <i class="fa-solid fa-box-open display-4 text-secondary mb-3"></i>
                <p class="text-muted">No hay artículos registrados en el stock.</p>
            </div>
        </main>
    </div>

    <!-- Modal Formulario Producto -->
    <div class="modal fade" id="product-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-secondary">
                <div class="modal-header border-secondary">
                    <h5 id="modal-title" class="modal-title fw-bold text-white">Agregar Artículo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="product-form" onsubmit="saveProduct(event)">
                    <div class="modal-body space-y-3">
                        <input type="hidden" id="product-id">

                        <div class="mb-3">
                            <label class="form-label small text-muted">Nombre del Artículo</label>
                            <input type="text" id="p-name" required class="form-control border-secondary" placeholder="Nombre de Articulo">
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small text-muted">Categoría</label>
                                <select id="p-category" onchange="updateSubcategories()" required class="form-select border-secondary">
                                    <option value="Parlantes">Parlantes</option>
                                    <option value="Auriculares">Auriculares</option>
                                    <option value="Cables USB">Cables USB</option>
                                    <option value="Cargadores">Cargadores</option>
                                    <option value="Power Bank">Power Bank</option>
                                    <option value="Otros">Otros</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Subcategoría</label>
                                <select id="p-subcategory" class="form-select border-secondary">
                                    <option value="">Ninguna / General</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small text-muted">Precio Costo ($ ARS)</label>
                                <input type="number" step="1" id="p-cost-ars" required class="form-control border-secondary" placeholder="Precio de Costo">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Precio Venta ($ ARS)</label>
                                <input type="number" step="1" id="p-price-ars" required class="form-control border-secondary" placeholder="Valor de Venta">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">Stock Disponible</label>
                            <input type="number" id="p-stock" required min="0" class="form-control border-secondary" placeholder="Cantidad en Stock">
                        </div>

                        <!-- Imagen -->
                        <div class="mb-3">
                            <label class="form-label small text-muted">Foto del Artículo</label>
                            <div class="d-flex gap-2 mb-2">
                                <label class="btn btn-outline-secondary btn-sm flex-fill cursor-pointer">
                                    <i class="fa-solid fa-upload me-1"></i> Biblioteca
                                    <input type="file" id="p-file-input" accept="image/*" class="d-none" onchange="handleImageUpload(event)">
                                </label>
                                <button type="button" onclick="openCameraModal()" class="btn btn-outline-secondary btn-sm flex-fill">
                                    <i class="fa-solid fa-camera me-1"></i> Cámara
                                </button>
                            </div>
                            <div id="image-preview-container" class="position-relative w-100 rounded border border-secondary overflow-hidden d-none text-center bg-black" style="height: 100px;">
                                <img id="p-image-preview" src="" class="h-100 object-fit-contain">
                                <button type="button" onclick="clearImage()" class="position-absolute top-0 end-0 m-1 btn btn-danger btn-sm rounded-circle py-0 px-1">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" id="btn-save-submit" class="btn btn-primary btn-sm">Guardar Artículo</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Cámara en Vivo -->
    <div class="modal fade" id="camera-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content shadow-lg border-secondary text-center p-3">
                <h5 class="fw-bold mb-3 text-white">Tomar Fotografía</h5>
                <div class="ratio ratio-4x3 bg-black rounded overflow-hidden mb-3">
                    <video id="camera-video" autoplay playsinline class="w-100 h-100 object-fit-cover"></video>
                </div>
                <div class="d-flex justify-content-center gap-2">
                    <button type="button" onclick="capturePhoto()" class="btn btn-success btn-sm">Capturar</button>
                    <button type="button" onclick="closeCameraModal()" class="btn btn-outline-secondary btn-sm">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas-capture" class="d-none"></canvas>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & Lógica de la App -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC-EcOQr60TtBqk67osJhUj2kOitAe5PFc",
            authDomain: "efese-app.firebaseapp.com",
            projectId: "efese-app",
            storageBucket: "efese-app.firebasestorage.app",
            messagingSenderId: "917869580027",
            appId: "1:917869580027:web:4d6e71f2efae1fc8336a5e"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let products = [];
        let currentImageBase64 = "";
        let officialDolarRate = 1000;
        let mediaStream = null;
        let showCostsGlobal = false;
        let productModal, cameraModal;

        window.addEventListener('DOMContentLoaded', () => {
            productModal = new bootstrap.Modal(document.getElementById('product-modal'));
            cameraModal = new bootstrap.Modal(document.getElementById('camera-modal'));
            fetchDolar();

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    document.getElementById('auth-screen').classList.add('d-none');
                    document.getElementById('app-screen').classList.remove('d-none');
                    document.getElementById('user-display').innerText = `Conectado: ${user.email}`;
                    loadProductsRealtime();
                } else {
                    document.getElementById('app-screen').classList.add('d-none');
                    document.getElementById('auth-screen').classList.remove('d-none');
                }
            });
        });

        window.handleLogin = function(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const errDiv = document.getElementById('login-error');
            errDiv.classList.add('d-none');

            signInWithEmailAndPassword(auth, email, pass)
                .catch(() => {
                    errDiv.innerText = "Correo o contraseña incorrectos.";
                    errDiv.classList.remove('d-none');
                });
        }

        window.logout = function() {
            signOut(auth);
        }

        function loadProductsRealtime() {
            onSnapshot(collection(db, "products"), (snapshot) => {
                products = [];
                snapshot.forEach((docSnap) => {
                    products.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderProducts();
            });
        }

        window.fetchDolar = async function() {
            try {
                const response = await fetch('https://dolarapi.com/v1/dolares/oficial');
                const data = await response.json();
                if(data && data.venta) {
                    officialDolarRate = data.venta;
                    document.getElementById('dolar-value').innerText = `$${officialDolarRate} ARS`;
                    renderProducts();
                }
            } catch (error) {
                console.error("Error al obtener dólar:", error);
                document.getElementById('dolar-value').innerText = `$1000 (Est.)`;
            }
        }

        window.toggleGlobalCosts = function() {
            showCostsGlobal = !showCostsGlobal;
            const btnText = document.getElementById('toggle-text');
            const btnIcon = document.querySelector('#btn-toggle-costs i');
            if(showCostsGlobal) {
                btnText.innerText = "Ocultar Costos";
                btnIcon.className = "fa-solid fa-eye";
            } else {
                btnText.innerText = "Ver Costos";
                btnIcon.className = "fa-solid fa-eye-slash";
            }
            renderProducts();
        }

        const subcategoriesMap = {
            "Cables USB": ["USB-C", "CaC", "V8", "Lightning", "Auxiliar"],
            "Cargadores": ["Cargador de Pared", "Cargador de Auto", "Inalámbrico"],
            "Parlantes": ["Bluetooth", "Portátil", "Torre de Sonido"],
            "Auriculares": ["In-Ear", "Over-Ear", "Bluetooth"],
            "Power Bank": ["10000mAh", "20000mAh", "Carga Rápida"],
            "Otros": ["Varios"]
        };

        window.updateSubcategories = function() {
            const cat = document.getElementById('p-category').value;
            const subSelect = document.getElementById('p-subcategory');
            subSelect.innerHTML = '<option value="">Ninguna / General</option>';
            if(subcategoriesMap[cat]) {
                subcategoriesMap[cat].forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub;
                    opt.textContent = sub;
                    subSelect.appendChild(opt);
                });
            }
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const emptyState = document.getElementById('empty-state');
            const search = document.getElementById('search-input').value.toLowerCase();
            const catFilter = document.getElementById('filter-category').value;

            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(search) || (p.subcategory && p.subcategory.toLowerCase().includes(search));
                const matchCat = catFilter === "" || p.category === catFilter;
                return matchSearch && matchCat;
            });

            if(filtered.length === 0) {
                emptyState.classList.remove('d-none');
                return;
            } else {
                emptyState.classList.add('d-none');
            }

            filtered.forEach(p => {
                const currentCostArs = Math.round((p.costUsd || 0) * officialDolarRate);
                const currentPriceArs = Math.round((p.priceUsd || 0) * officialDolarRate);
                const margin = currentCostArs > 0 ? Math.round(((currentPriceArs - currentCostArs) / currentCostArs) * 100) : 0;

                const col = document.createElement('div');
                col.className = "col";
                col.innerHTML = `
                    <div class="card h-100 shadow-sm border-secondary">
                        <div class="position-relative overflow-hidden product-img d-flex align-items-center justify-content-center">
                            ${p.image ? `<img src="${p.image}" class="w-100 h-100 object-fit-cover">` : `<i class="fa-solid fa-image fa-2x text-secondary"></i>`}
                            <span class="position-absolute top-0 start-0 m-2 badge bg-dark border border-secondary">${p.category}</span>
                            ${p.subcategory ? `<span class="position-absolute top-0 end-0 m-2 badge bg-primary">${p.subcategory}</span>` : ''}
                        </div>
                        <div class="card-body d-flex flex-column justify-content-between p-3">
                            <div>
                                <h5 class="card-title text-white fs-6 text-truncate mb-2">${p.name}</h5>
                                
                                <div class="d-flex justify-content-between align-items-baseline mb-2">
                                    <div>
                                        <small class="text-muted d-block" style="font-size: 0.75rem;">PRECIO VENTA</small>
                                        <span class="fs-4 fw-bold text-success">$${currentPriceArs.toLocaleString('es-AR')}</span>
                                    </div>
                                    <div class="text-end">
                                        <small class="text-muted d-block" style="font-size: 0.75rem;">STOCK</small>
                                        <span class="badge bg-secondary">${p.stock} un.</span>
                                    </div>
                                </div>

                                <div class="cost-section p-2 rounded mb-3 ${showCostsGlobal ? '' : 'd-none'}">
                                    <div class="d-flex justify-content-between small text-muted mb-1">
                                        <span>Costo: <strong class="text-white">$${currentCostArs.toLocaleString('es-AR')}</strong></span>
                                        <span class="text-warning">Ganancia: +${margin}%</span>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex gap-2 pt-2 border-top border-secondary">
                                <button onclick="editProduct('${p.id}')" class="btn btn-outline-secondary btn-sm flex-fill">
                                    <i class="fa-solid fa-pen me-1"></i> Editar
                                </button>
                                <button onclick="deleteProduct('${p.id}')" class="btn btn-outline-danger btn-sm px-2">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        }

        window.filterProducts = function() { renderProducts(); }

        window.openModal = function(id = null) {
            updateSubcategories();
            if(id) {
                document.getElementById('modal-title').innerText = "Editar Artículo";
                const p = products.find(item => item.id === id);
                if(p) {
                    document.getElementById('product-id').value = p.id;
                    document.getElementById('p-name').value = p.name;
                    document.getElementById('p-category').value = p.category;
                    updateSubcategories();
                    document.getElementById('p-subcategory').value = p.subcategory || "";
                    
                    const currentCostArs = Math.round((p.costUsd || 0) * officialDolarRate);
                    const currentPriceArs = Math.round((p.priceUsd || 0) * officialDolarRate);
                    document.getElementById('p-cost-ars').value = currentCostArs;
                    document.getElementById('p-price-ars').value = currentPriceArs;
                    document.getElementById('p-stock').value = p.stock;

                    currentImageBase64 = p.image || "";
                    if(currentImageBase64) {
                        document.getElementById('p-image-preview').src = currentImageBase64;
                        document.getElementById('image-preview-container').classList.remove('d-none');
                    } else {
                        clearImage();
                    }
                }
            } else {
                document.getElementById('modal-title').innerText = "Agregar Artículo";
                document.getElementById('product-form').reset();
                document.getElementById('product-id').value = "";
                clearImage();
                updateSubcategories();
            }
            productModal.show();
        }

        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    document.getElementById('p-image-preview').src = currentImageBase64;
                    document.getElementById('image-preview-container').classList.remove('d-none');
                }
                reader.readAsDataURL(file);
            }
        }

        window.clearImage = function() {
            currentImageBase64 = "";
            document.getElementById('p-image-preview').src = "";
            document.getElementById('image-preview-container').classList.add('d-none');
            document.getElementById('p-file-input').value = "";
        }

        window.openCameraModal = async function() {
            cameraModal.show();
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                document.getElementById('camera-video').srcObject = mediaStream;
            } catch(err) {
                alert("No se pudo acceder a la cámara.");
                cameraModal.hide();
            }
        }

        window.closeCameraModal = function() {
            if(mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); }
            cameraModal.hide();
        }

        window.capturePhoto = function() {
            const video = document.getElementById('camera-video');
            const canvas = document.getElementById('canvas-capture');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            currentImageBase64 = canvas.toDataURL('image/png');
            document.getElementById('p-image-preview').src = currentImageBase64;
            document.getElementById('image-preview-container').classList.remove('d-none');
            closeCameraModal();
        }

        window.saveProduct = async function(e) {
            e.preventDefault();
            const btnSave = document.getElementById('btn-save-submit');
            btnSave.disabled = true;
            btnSave.innerText = "Guardando...";

            const id = document.getElementById('product-id').value;
            const name = document.getElementById('p-name').value;
            const category = document.getElementById('p-category').value;
            const subcategory = document.getElementById('p-subcategory').value;
            
            const costArsInput = parseFloat(document.getElementById('p-cost-ars').value) || 0;
            const priceArsInput = parseFloat(document.getElementById('p-price-ars').value) || 0;
            const stock = parseInt(document.getElementById('p-stock').value) || 0;

            const costUsd = costArsInput / officialDolarRate;
            const priceUsd = priceArsInput / officialDolarRate;

            const productData = { name, category, subcategory, costUsd, priceUsd, stock, image: currentImageBase64 };

            try {
                if(id) {
                    await updateDoc(doc(db, "products", id), productData);
                } else {
                    await addDoc(collection(db, "products"), productData);
                }
                productModal.hide();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar en la nube.");
            } finally {
                btnSave.disabled = false;
                btnSave.innerText = "Guardar Artículo";
            }
        }

        window.editProduct = function(id) { openModal(id); }

        window.deleteProduct = async function(id) {
            if(confirm("¿Estás seguro de eliminar este artículo del stock?")) {
                try {
                    await deleteDoc(doc(db, "products", id));
                } catch (error) {
                    alert("No se pudo eliminar el artículo.");
                }
            }
        }
    </script>
</body>
</html>
