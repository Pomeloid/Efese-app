<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Stock - Negocio</title>
    <!-- Tailwind CSS para un diseño moderno y adaptable a celulares -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Firebase SDKs -->
    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC-EcOQr60TtBqk67osJhUj2kOitAe5PFc",
    authDomain: "efese-app.firebaseapp.com",
    projectId: "efese-app",
    storageBucket: "efese-app.firebasestorage.app",
    messagingSenderId: "917869580027",
    appId: "1:917869580027:web:4d6e71f2efae1fc8336a5e"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Variables globales
        window.db = db;
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
        window.doc = doc;
        window.deleteDoc = deleteDoc;
        window.updateDoc = updateDoc;
        window.onSnapshot = onSnapshot;

        // Control de Autenticación
        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            const appScreen = document.getElementById('app-screen');
            if (user) {
                loginScreen.classList.add('hidden');
                appScreen.classList.remove('hidden');
                cargarArticulosEnTiempoReal();
            } else {
                loginScreen.classList.remove('hidden');
                appScreen.classList.add('hidden');
            }
        });

        window.login = function() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            signInWithEmailAndPassword(auth, email, pass)
                .catch((error) => {
                    errorDiv.innerText = "Error: Credenciales incorrectas o problema de red.";
                    errorDiv.classList.remove('hidden');
                });
        }

        window.logout = function() {
            signOut(auth);
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-p-0 pb-12">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
            <h1 class="text-2xl font-bold text-center text-slate-900 mb-2">📦 Control de Stock</h1>
            <p class="text-xs text-center text-slate-500 mb-6">Ingresa con tus datos de acceso</p>
            
            <div id="login-error" class="hidden bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded mb-4 text-xs"></div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Correo electrónico</label>
                    <input type="email" id="email" placeholder="Ej: negocio@correo.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                </div>
                <button onclick="login()" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition duration-200 text-sm shadow-md">Ingresar</button>
            </div>
        </div>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-screen" class="hidden max-w-md mx-auto p-4">
        <!-- Encabezado -->
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm mb-4">
            <h1 class="text-lg font-bold text-indigo-600">Control de Artículos</h1>
            <button onclick="logout()" class="text-xs bg-red-50 text-red-600 px-3 py-1.5 rounded-lg font-medium hover:bg-red-100">Salir</button>
        </div>

        <!-- Formulario para agregar producto -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4">
            <h2 class="text-sm font-bold text-slate-700 mb-3">Agregar Nuevo Artículo</h2>
            <form id="product-form" onsubmit="guardarArticulo(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">Nombre del producto</label>
                    <input type="text" id="nombre" placeholder="Ej: Milanesas de carne xkg" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Precio Costo ($)</label>
                        <input type="number" id="costo" placeholder="Ej: 4500" step="any" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Valor Venta ($)</label>
                        <input type="number" id="venta" placeholder="Ej: 7000" step="any" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Cantidad Stock</label>
                        <input type="number" id="stock" placeholder="Ej: 10" required class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Foto (Opcional)</label>
                        <input type="file" id="foto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-2 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    </div>
                </div>
                <button type="submit" id="btn-guardar" class="w-full bg-indigo-600 text-white font-semibold py-2.5 rounded-lg hover:bg-indigo-700 transition duration-200 text-sm shadow-md mt-2">Guardar Artículo</button>
            </form>
        </div>

        <!-- Buscador -->
        <div class="mb-4">
            <input type="text" id="buscador" placeholder="🔍 Buscar producto..." onkeyup="filtrarArticulos()" class="w-full px-3 py-2 bg-white border rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        </div>

        <!-- Listado de Artículos -->
        <div id="lista-articulos" class="space-y-3">
            <!-- Los productos se cargarán aquí dinámicamente -->
        </div>
    </div>

    <!-- Lógica de la Aplicación y Firestore -->
    <script>
        let listaGlobalArticulos = [];

        // Guardar artículo con bloqueo de doble clic
        window.guardarArticulo = async function(event) {
            event.preventDefault();
            const btnGuardar = document.getElementById('btn-guardar');
            
            // Deshabilitar botón inmediatamente para evitar multiclics
            btnGuardar.disabled = true;
            btnGuardar.innerText = "Guardando...";
            btnGuardar.classList.add('opacity-50', 'cursor-not-allowed');

            const nombre = document.getElementById('nombre').value;
            const costo = parseFloat(document.getElementById('costo').value);
            const venta = parseFloat(document.getElementById('venta').value);
            const stock = parseInt(document.getElementById('stock').value);
            const inputFoto = document.getElementById('foto');

            let imagenBase64 = "";

            if (inputFoto.files && inputFoto.files[0]) {
                const archivo = inputFoto.files[0];
                imagenBase64 = await comprimirYConvertirImagen(archivo);
            }

            try {
                await window.addDoc(window.collection(window.db, "articulos"), {
                    nombre,
                    costo,
                    venta,
                    stock,
                    imagen: imagenBase64,
                    fecha: new Date()
                });

                // Limpiar formulario
                document.getElementById('product-form').reset();
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Hubo un error al guardar en la nube. Revisa tu conexión.");
            } finally {
                // Restaurar botón pase lo que pase
                btnGuardar.disabled = false;
                btnGuardar.innerText = "Guardar Artículo";
                btnGuardar.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // Función para comprimir la imagen antes de subirla (cuida el almacenamiento)
        function comprimirYConvertirImagen(archivo) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        // Reducir tamaño máximo a 400px de ancho/alto para optimizar Firestore
                        const MAX_WIDTH = 400;
                        const MAX_HEIGHT = 400;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);

                        // Comprimir a JPEG con calidad 0.7
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    }
                    img.src = e.target.result;
                }
                reader.readAsDataURL(archivo);
            });
        }

        // Cargar artículos en tiempo real desde Firestore
        function cargarArticulosEnTiempoReal() {
            window.onSnapshot(window.collection(window.db, "articulos"), (snapshot) => {
                listaGlobalArticulos = [];
                snapshot.forEach((docSnap) => {
                    listaGlobalArticulos.push({ id: docSnap.id, ...docSnap.data() });
                });
                mostrarArticulos(listaGlobalArticulos);
            });
        }

        // Mostrar artículos en pantalla
        function mostrarArticulos(articulos) {
            const contenedor = document.getElementById('lista-articulos');
            contenedor.innerHTML = "";

            if (articulos.length === 0) {
                contenedor.innerHTML = `<p class="text-center text-xs text-slate-400 py-4">No hay artículos registrados.</p>`;
                return;
            }

            articulos.forEach((art) => {
                const div = document.createElement('div');
                div.className = "bg-white p-3 rounded-xl shadow-sm flex items-center justify-between gap-3";
                
                const imagenHtml = art.imagen 
                    ? `<img src="${art.imagen}" class="w-12 h-12 object-cover rounded-lg shrink-0">` 
                    : `<div class="w-12 h-12 bg-slate-100 rounded-lg flex items-center justify-center text-xs text-slate-400 shrink-0">Sin foto</div>`;

                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        ${imagenHtml}
                        <div class="truncate">
                            <h3 class="font-bold text-sm text-slate-800 truncate">${art.nombre}</h3>
                            <p class="text-xs text-slate-500">Costo: $${art.costo} | Venta: <span class="font-semibold text-emerald-600">$${art.venta}</span></p>
                            <p class="text-xs text-slate-600 font-medium">Stock: ${art.stock}</p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 shrink-0">
                        <button onclick="cambiarStock('${art.id}', ${art.stock}, 1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-bold">+</button>
                        <button onclick="cambiarStock('${art.id}', ${art.stock}, -1)" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-2.5 py-1 rounded text-xs font-bold">-</button>
                        <button onclick="eliminarArticulo('${art.id}')" class="text-red-400 hover:text-red-600 text-xs mt-1 text-center">🗑️</button>
                    </div>
                `;
                contenedor.appendChild(div);
            });
        }

        // Cambiar stock rápido (+1 o -1)
        window.cambiarStock = async function(id, stockActual, cambio) {
            const nuevoStock = stockActual + cambio;
            if (nuevoStock < 0) return;
            const docRef = window.doc(window.db, "articulos", id);
            await window.updateDoc(docRef, { stock: nuevoStock });
        }

        // Eliminar artículo
        window.eliminarArticulo = async function(id) {
            if (confirm("¿Estás seguro de eliminar este artículo?")) {
                await window.deleteDoc(window.doc(window.db, "articulos", id));
            }
        }

        // Filtrar buscador
        window.filtrarArticulos = function() {
            const texto = document.getElementById('buscador').value.toLowerCase();
            const filtrados = listaGlobalArticulos.filter(art => art.nombre.toLowerCase().includes(texto));
            mostrarArticulos(filtrados);
        }
    </script>
</body>
</html>
